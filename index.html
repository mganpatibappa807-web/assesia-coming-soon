<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assesia USA | Executive Assessment Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050a15;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .container {
            max-width: 650px;
            padding: 40px;
        }
        .badge {
            background: rgba(0, 255, 255, 0.05);
            color: #00e5ff;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 700;
            border: 1px solid rgba(0, 229, 255, 0.2);
            display: inline-block;
            margin-bottom: 30px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
        }
        h1 {
            font-size: 3.5rem;
            margin: 0 0 20px 0;
            letter-spacing: -1.5px;
            font-weight: 700;
        }
        p {
            color: #8b949e;
            font-size: 1.15rem;
            line-height: 1.7;
            margin-bottom: 40px;
            font-weight: 300;
        }
        .contact-box {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 30px;
        }
        .contact-label {
            font-size: 0.85rem;
            color: #6e7681;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }
        .phone {
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 1px;
        }
        /* Subtle glow effect for the title */
        h1 span {
            background: -webkit-linear-gradient(#ffffff, #7bb0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Invitation-Only Alpha Program</div>
        <h1><span>Assesia</span> USA</h1>
        <p>Transforming Education with Behavioral Analytics and Predictive Insights. Our Enterprise Assessment Engine is currently undergoing secure infrastructure deployment for our partner schools.</p>
        
        <div class="contact-box">
            <div class="contact-label">For Exclusive Waitlist Inquiries</div>
            <div class="phone">+91 9636650264</div>
        </div>
    </div>
</body>
</html>
